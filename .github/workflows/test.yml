name: Test

# Runs on pull requests only now — pushes to main are covered by the `test`
# job embedded in deploy.yml, which actually gates the deploy. Keeping this
# separate PR-only workflow means you still get test feedback before merging,
# without running the suite twice on every push to main.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
