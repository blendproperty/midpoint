name: Deploy to VPS

on:
  push:
    branches:
      - main

# Multiple rapid pushes used to trigger overlapping deploy runs that all SSH
# in and run `git pull` + `docker build` + `docker up` concurrently against
# the SAME checkout directory on the server — a real race condition (one
# run's git pull / build could interleave with another's, producing an
# inconsistent build). This forces deploys for this branch to queue and run
# one at a time, in order, never in parallel.
concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the deploy job below only runs if this one succeeds. Previously
  # tests ran in a completely separate workflow that never blocked anything
  # — a failing test and a broken build could still deploy straight to
  # production. Now a red test suite stops the SSH deploy from running at all.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # Give every Docker build a stable identifier derived from the
            # exact commit being deployed. Next.js uses this to detect an open
            # tab from an older release and hard-reload it instead of mixing
            # incompatible RSC responses and JavaScript chunks.
            export NEXT_DEPLOYMENT_ID="$(git rev-parse --short=12 HEAD)"
            # `migrate` runs under --profile tools, which `docker compose up`
            # does NOT include even with --build. Without this explicit build,
            # migrate silently keeps running whatever image was last built for
            # it, so a new migration file never actually gets applied while
            # `web` (which IS rebuilt by `up --build`) starts expecting the new
            # column/table and crashes. Build both explicitly first.
            docker compose -f compose.prod.yml build web migrate
            docker compose -f compose.prod.yml up -d --build
            docker compose -f compose.prod.yml --profile tools run --rm migrate
            # Verify the new release is the one actually served through
            # Cloudflare, not merely a successfully built local image.
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              https://www.mid-point.co.za/ \
              | grep -F "?dpl=$NEXT_DEPLOYMENT_ID"
            # Cleanup only — never fails the deploy. Rapid successive pushes
            # trigger overlapping deploy runs on the same host, and Docker
            # only allows one `image prune` at a time; a collision here used
            # to mark an otherwise-successful deploy as failed.
            docker image prune -f || true
